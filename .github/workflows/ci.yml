name: CI
on:
  pull_request:
  push:
    branches: [main]
  # workflow_dispatch enables the on-demand macos-smoke-rust job below.
  # All other jobs run on pull_request / push as before; macos-smoke-rust is
  # guarded by `if: github.event_name == 'workflow_dispatch'` so a manual
  # dispatch is the only thing that spends a macOS runner.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# All Linux jobs run inside ghcr.io/<owner>/ry-ci, which bakes in
# clang/clang++/FileCheck (LLVM 21, source-built), OpenSSL 3, cmake,
# ninja, ccache, cppcheck, and a pinned GoogleTest source tarball at
# $RY_VENDORED_GTEST_TARBALL. There is no `apt` / `apt-get` invocation
# anywhere in this workflow — that is the central property the image
# was introduced to provide (see issue #1505).
env:
  CI_IMAGE: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Check for banned unsafe allocation functions
        run: |
          # Scan src/ and include/ for raw malloc/realloc/calloc/strdup/strndup.
          # Exclude runtime/core/alloc.hpp (the wrapper implementation itself) and
          # lines that are already using the checked_* wrappers.
          if grep -rn --include='*.cpp' --include='*.hpp' \
            -E '\b(std::)?(malloc|realloc|calloc|strdup|strndup)\s*\(' \
            src/ include/ \
            | grep -v 'runtime/core/alloc\.hpp' \
            | grep -v 'checked_'; then
            echo "::error::Raw allocation functions detected. Use checked_* wrappers from include/ry/runtime/core/alloc.hpp instead."
            exit 1
          fi
      - name: Check llvm_emit ABI header (no LLVM types, no transitional void *)
        run: |
          # Enforces #1973 Stage 2-C AC: include/ry/llvm_emit/api.h must
          # expose only opaque typedefs (RyValueRef / RyTypeRef /
          # RyModuleHandle / RyBuilderHandle / RyContextHandle /
          # RyFunctionHandle / RyFuncTypeRef / RyBasicBlockRef) — no
          # `llvm::*` and no `void *` in public function signatures, with a
          # documented carve-out for `void *user_ctx` in RyBuildValueFn /
          # ry_emit_result_branch.
          bash scripts/check-llvm-emit-abi-header.sh include/ry/llvm_emit/api.h
      - name: Check emit abi layer emits no LLVM IR (#2069)
        run: |
          # Enforces #2069 AC: the abi boundary layer (crates/emit/src/abi.rs +
          # abi/**) must contain ZERO LLVM IR generation — it is a pure
          # mechanical-translation shell (resolve ids, wrap handles, build
          # closures, intern results) over the `core` engine, which owns all IR
          # emission. Forbids LLVMBuild* / basic-block ops / phi-incoming /
          # `llvm_sys::core`; allows `use llvm_sys::prelude` (type-cast handles).
          # Pure bash/grep/awk — no toolchain needed, like the api.h header lint
          # above. Keeps the abi layer uniform and deletable as ops migrate
          # (#2023). The same script is the local reproduction.
          bash scripts/check-emit-abi-no-ir.sh
      - name: Check emit layering direction (primitive ⇏ composite, context ⇏ all) (#2109)
        run: |
          # Enforces #2109 layering invariants: primitive/** and context.rs
          # must not import from crate::composite (the reverse of the allowed
          # abi → composite → primitive → context direction). context.rs
          # additionally must not import crate::abi or crate::primitive,
          # because context sits below every other layer. The gate has a known
          # blind spot — self.method() dispatch (both layers impl on EmitCtx)
          # cannot be caught by import-path inspection; the future physical
          # crate split (#2023) turns this into a Cargo-enforced constraint.
          bash scripts/check-emit-composite-no-primitive.sh
      - name: 'Check emit composite LLVM IR-gen concentration (#2109 AC #5/#7)'
        run: |
          # Enforces #2109 AC #5/#7: the LLVM C IR-generation API
          # (`llvm_sys::core`, `LLVMBuild*`) must be confined to the primitive
          # layer. composite/**.rs files that still call LLVM C API directly
          # are listed in the script's ALLOWLIST as a transitional carve-out
          # (the #2109 verbatim move preserves byte-exact IR; full migration
          # to primitive method sequences is a follow-on issue). New composite
          # files outside the allowlist must express their op via primitive
          # methods (self.build_load(...) etc.).
          bash scripts/check-emit-llvm-ir-gen-concentration.sh
      - name: Check for banned direct exit() calls in runtime
        run: |
          # Trap-path runtime functions must use ry_runtime_trap_exit()
          # from include/ry/runtime/core/alloc.hpp, not exit(). exit() runs
          # the atexit chain, which on Linux glibc invokes LLVM
          # ManagedStatic destructors on a heap still referenced by the
          # JIT'd module — `free(): invalid pointer` SIGABRT before the
          # expected ExitedWithCode(1) is observed (#1838). The \b in
          # the regex prevents matches against the allowed forms _exit,
          # _Exit, quick_exit, getStdlibExit, getStdlibImmediateExit,
          # which all have a word character (underscore or letter)
          # immediately before "exit" and so don't match a word
          # boundary at the start.
          if grep -rnE --include='*.cpp' '\b(std::)?exit\s*\(' src/runtime/ \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo "::error::Direct exit() call in src/runtime/**/*.cpp detected. Use ry_runtime_trap_exit() (from include/ry/runtime/core/alloc.hpp) instead."
            exit 1
          fi
      - name: Check prompt/instruction reference integrity (#2029)
        run: |
          # Reference-integrity lint for prompt definition files (.claude/ +
          # AGENTS.md + CLAUDE.md): fails on stale inline-code paths
          # (#1827-class drift) and dead /skill links. Pure bash/grep/awk/find —
          # no toolchain or build artifacts needed. Escape hatch for
          # non-existent example paths: fenced blocks / plain prose (the lint
          # only inspects inline-code backtick spans). See the script header
          # and .claude/rules/docs-reference-conventions.md.
          bash scripts/check-prompt-refs.sh
      - name: Run Cppcheck
        run: |
          # `--suppress=normalCheckLevelMaxBranches` is required from
          # cppcheck 2.16+: that release flips the previously-silent
          # "function exceeds the analysis branch budget" notice from
          # an `information` to a hard exit when paired with
          # `--error-exitcode=1`. The notice is purely advisory and
          # does not flag a defect, so suppressing it at the workflow
          # level keeps the no-apt CI image (which ships cppcheck
          # 2.16) green without having to add a per-file suppression.
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++17 \
            --error-exitcode=1 \
            --suppressions-list=.cppcheck-suppressions \
            --suppress=normalCheckLevelMaxBranches \
            --inline-suppr \
            -i build -i build-asan \
            -j "$(nproc)" \
            --quiet \
            src/ include/

      - name: Rust workspace check (#1995 ABI layout assert)
        run: |
          # The Rust half of the C++ <-> Rust ABI struct-layout contract:
          # the `const _: () = assert!(size_of / align_of / offset_of! ...)`
          # items in crates/emit/src/abi.rs are const-evaluated during
          # `cargo check`, so this step fails on any layout drift. The
          # `--workspace --all-targets` scope mirrors the local wrapper
          # (.claude/skills/pre-commit-checklist/run-rust-lint.sh) and
          # covers every member crate (currently `emit` + `native_base64`,
          # plus any future native_* crate added by issues like #2282).
          # (The C++ half is the static_assert TU compiled into ry_tests by
          # the `test` job.) cargo / CARGO_HOME / LLVM_SYS_211_PREFIX are
          # baked into the CI image (docker/ci.Dockerfile). This is a narrow
          # type-check + layout-assert pass; it does NOT build `ry` against
          # the Rust cdylib — the full integration build is the `test` job.
          cargo check --workspace --all-targets

      - name: 'Rust format check (rustfmt, #2015)'
        run: |
          # Rust quality gate symmetric with the C++ cppcheck gate. rustfmt
          # needs no LLVM. The image's Rust is the version pinned locally by
          # rust-toolchain.toml (kept equal to docker/ci.Dockerfile
          # RUST_VERSION), so `--check` here matches local `cargo fmt` output.
          # `--all` runs over every workspace member (#2344 aligned scope
          # with the local wrapper, so new native_* crates land covered).
          cargo fmt --all -- --check

      - name: 'Rust lint (clippy, #2015)'
        run: |
          # clippy compiles llvm-sys exactly like the `cargo check` step above,
          # so it relies on the same baked LLVM_SYS_211_PREFIX + shared libLLVM
          # in the image ENV. `-D warnings` makes any lint a hard failure. Kept
          # separate from `cargo check` (whose #1995 ABI-layout-assert purpose is
          # orthogonal) rather than merged. `--workspace --all-targets` matches
          # the local wrapper (#2344) so the gate covers every member crate.
          cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-test-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-test-${{ github.ref }}-
            ci-test-
      - name: Build
        # emit is the Rust cdylib (the only implementation). The
        # container's /usr/local/llvm is built with LLVM_BUILD_LLVM_DYLIB=ON,
        # so the shared-libLLVM requirement (#1997) is met without an LLVM_DIR
        # override (see docker/ci.Dockerfile).
        run: |
          cmake --preset default
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
      - name: Test (Ry self-tests)
        run: ./build/ry test
      - name: 'Test (canonical examples, #2329)'
        # Run every examples/*.ry (non-recursive — future negative/review
        # subdirs are excluded by construction; see examples/README.md).
        # Exit-code only, no golden output matching. Catches drift between
        # the LoRA-source examples and current language semantics.
        run: bash scripts/check-examples.sh
      - name: 'Test (export-run-logs JSONL schema, #2300)'
        run: bash tests/scripts/test-export-run-logs.sh
      - name: Bundle distribution (Linux)
        # Exercise the #2005 packaging path on every PR/push: release.yml is
        # tag-driven and cannot be dry-run, so the bundling + rpath rewrite is
        # validated here against the same build/ tree the release job uses.
        run: bash scripts/bundle-dist.sh linux build dist
      - name: Verify bundle (Linux)
        run: bash scripts/verify-bundle.sh dist linux
      - name: Clean-room startup (Linux, system libLLVM removed)
        run: |
          # Hide the REAL libLLVM file (follow the symlink chain) so the only
          # resolution path is the bundled lib/ ($ORIGIN/lib rpath). LD_LIBRARY_PATH
          # is left intact on purpose — openssl lives there and is out of scope for
          # #2005 (v0.0.25 parity); only the libLLVM.so file is removed.
          sys_llvm="$(readlink -f "$(ldd build/ry | awk '/libLLVM/{print $3; exit}')")"
          echo "hiding system libLLVM: $sys_llvm"
          mv "$sys_llvm" "$sys_llvm.hidden"
          trap 'mv -f "$sys_llvm.hidden" "$sys_llvm" 2>/dev/null || true' EXIT
          # Guard against a false pass: a leftover symlink to the system libLLVM
          # would let the bundle "work" for the wrong reason. Prove dist/ry now
          # resolves libLLVM from the bundle, not from /usr/local/llvm.
          if ldd dist/ry | grep -q '/usr/local/llvm'; then
            echo "::error::dist/ry still resolves libLLVM from /usr/local/llvm — bundle rpath ineffective"
            exit 1
          fi
          dist/ry --version
          echo 'print("clean room ok")' | dist/ry -c
          # Exercise the float/ConstantFP path (#1997) — the canonical libLLVM use
          # on the Rust cdylib side, which the shared-instance requirement exists for.
          echo 'print(3.14 + 2.71)' | dist/ry -c

  # Heavy analysis jobs (asan, filecheck):
  # All run on every pull_request and on push triggers configured at the
  # workflow level. There is no PR-only skip — the trunk-based development
  # model assumes heavy coverage gates each PR (#1367). The filecheck job
  # remains warn-only (LLVM-version sensitivity until goldens are confirmed
  # stable).
  #
  # The commented-out fuzz block at the bottom of this file keeps its
  # internal `if:` gate intentionally; do not "tidy" it during edits — when
  # the block is re-enabled the gate may need a deliberate decision.

  filecheck:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-filecheck-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-filecheck-${{ github.ref }}-
            ci-filecheck-
      - name: Configure
        run: cmake --preset default
      - name: Build ry
        run: cmake --build build --target ry
      - name: Run FileCheck IR golden tests
        # warn-only: triage LLVM-version sensitivity before making this required.
        # Once goldens are confirmed stable across LLVM updates, remove continue-on-error.
        continue-on-error: true
        run: ctest --test-dir build -L filecheck --output-on-failure

  asan:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-asan-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-asan-${{ github.ref }}-
            ci-asan-
      - name: Build (ASan + UBSan)
        # Only the C++ side (ry_lib / ry / ry_tests) is ASan+UBSan-instrumented;
        # the Rust cdylib and shared libLLVM are uninstrumented because corrosion
        # does not propagate -fsanitize=* into the cargo build (#1993). This
        # mirrors LLVM itself, which is also linked uninstrumented.
        run: |
          cmake --preset asan
          cmake --build build-asan
      - name: Test (C++ / ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/ry_tests
      - name: Test (Ry self-tests / ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/ry test

  macos-smoke-rust:
    # macOS build/link smoke for the emit Rust cdylib.
    # workflow_dispatch-only: macOS runners cost ~10x a Linux runner, and the
    # purpose is to prove the Apple-linker path works on demand — specifically
    # that the `-Wl,-undefined,dynamic_lookup` cdylib link arg in
    # crates/emit/build.rs resolves __ry_* and LLVM* symbols from the
    # host process. The per-PR safety net is the Linux test/asan jobs
    # above. Homebrew llvm@21 ships a shared libLLVM.dylib, satisfying the
    # shared-libLLVM requirement (#1997). Retained past the #1993 cutover to
    # keep continuous Apple-linker validation before the tag-push-driven
    # release.yml runs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache LLVM 21 (brew)
        id: cache-llvm-brew
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/opt/llvm@21
            /opt/homebrew/Cellar/llvm@21
          key: llvm-21-darwin-arm64
      - name: Install LLVM 21 (brew)
        if: steps.cache-llvm-brew.outputs.cache-hit != 'true'
        run: brew install llvm@21
      - name: Install dependencies (brew)
        run: brew install openssl@3 ninja googletest
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-macos-smoke-rust
          restore-keys: |
            ci-macos-smoke-rust-
      - name: Build (Rust emit)
        # Homebrew llvm@21 provides the shared libLLVM.dylib that the Rust
        # cdylib requires; cargo/rustc are pre-installed on GitHub macOS
        # runners. LLVM_SYS_211_PREFIX is derived by CMake from LLVM_DIR via
        # corrosion_set_env_vars (see CMakeLists.txt), so llvm-sys finds the
        # same Homebrew LLVM. This is the CI form of the local
        # `cmake --preset rust-emit` build.
        run: |
          cmake -B build -G Ninja \
            -DLLVM_DIR="$(brew --prefix llvm@21)/lib/cmake/llvm" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
      - name: Test (Ry self-tests)
        run: ./build/ry test -p
      - name: Bundle distribution (macOS)
        # Validate the #2005 packaging path on the Apple-linker side (the only
        # place install_name_tool rewrites are exercised before a tag push).
        run: bash scripts/bundle-dist.sh darwin build dist
      - name: Verify bundle (macOS)
        run: bash scripts/verify-bundle.sh dist darwin
      - name: Clean-room startup (macOS, system libLLVM hidden)
        run: |
          # Hide the Homebrew libLLVM so dist/ry must resolve @rpath/libLLVM from
          # the bundled lib/. openssl@3 stays installed (out of scope, #2005).
          L="$(brew --prefix llvm@21)/lib/libLLVM.dylib"
          mv "$L" "$L.hidden"
          trap 'mv -f "$L.hidden" "$L" 2>/dev/null || true' EXIT
          dist/ry --version
          echo 'print("clean room ok")' | dist/ry -c

