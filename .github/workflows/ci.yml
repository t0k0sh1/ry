name: CI
on:
  pull_request:
  push:
    branches: [main, 'v[0-9]*']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache LLVM 21
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /usr/lib/llvm-21
          key: llvm-21-ubuntu-${{ runner.os }}
      - name: Install LLVM 21
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-ubuntu-${{ github.ref }}
          restore-keys: |
            ci-ubuntu-
      - name: Build
        run: |
          cmake -B build -G Ninja -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
