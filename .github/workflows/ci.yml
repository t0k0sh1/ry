name: CI
on:
  pull_request:
  push:
    branches: [main]
  # workflow_dispatch enables the on-demand macos-smoke-rust job below.
  # All other jobs run on pull_request / push as before; macos-smoke-rust is
  # guarded by `if: github.event_name == 'workflow_dispatch'` so a manual
  # dispatch is the only thing that spends a macOS runner.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# All Linux jobs run inside ghcr.io/<owner>/ry-ci, which bakes in
# clang/clang++/clang-tidy/scan-build/FileCheck (LLVM 21, source-built),
# OpenSSL 3, cmake, ninja, ccache, cppcheck, and a pinned GoogleTest
# source tarball at $RY_VENDORED_GTEST_TARBALL. There is no `apt` /
# `apt-get` invocation anywhere in this workflow — that is the central
# property the image was introduced to provide (see issue #1505).
env:
  CI_IMAGE: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Check for banned unsafe allocation functions
        run: |
          # Scan src/ and include/ for raw malloc/realloc/calloc/strdup/strndup.
          # Exclude runtime/core/alloc.hpp (the wrapper implementation itself) and
          # lines that are already using the checked_* wrappers.
          if grep -rn --include='*.cpp' --include='*.hpp' \
            -E '\b(std::)?(malloc|realloc|calloc|strdup|strndup)\s*\(' \
            src/ include/ \
            | grep -v 'runtime/core/alloc\.hpp' \
            | grep -v 'checked_'; then
            echo "::error::Raw allocation functions detected. Use checked_* wrappers from include/ry/runtime/core/alloc.hpp instead."
            exit 1
          fi
      - name: Check llvm_emit ABI header (no LLVM types, no transitional void *)
        run: |
          # Enforces #1973 Stage 2-C AC: include/ry/llvm_emit/api.h must
          # expose only opaque typedefs (RyValueRef / RyTypeRef /
          # RyModuleHandle / RyBuilderHandle / RyContextHandle /
          # RyFunctionHandle / RyFuncTypeRef / RyBasicBlockRef) — no
          # `llvm::*` and no `void *` in public function signatures, with a
          # documented carve-out for `void *user_ctx` in RyBuildValueFn /
          # ry_emit_result_branch.
          bash scripts/check-llvm-emit-abi-header.sh include/ry/llvm_emit/api.h
      - name: Check for banned direct exit() calls in runtime
        run: |
          # Trap-path runtime functions must use ry_runtime_trap_exit()
          # from include/ry/runtime/core/alloc.hpp, not exit(). exit() runs
          # the atexit chain, which on Linux glibc invokes LLVM
          # ManagedStatic destructors on a heap still referenced by the
          # JIT'd module — `free(): invalid pointer` SIGABRT before the
          # expected ExitedWithCode(1) is observed (#1838). The \b in
          # the regex prevents matches against the allowed forms _exit,
          # _Exit, quick_exit, getStdlibExit, getStdlibImmediateExit,
          # which all have a word character (underscore or letter)
          # immediately before "exit" and so don't match a word
          # boundary at the start.
          if grep -rnE --include='*.cpp' '\b(std::)?exit\s*\(' src/runtime/ \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo "::error::Direct exit() call in src/runtime/**/*.cpp detected. Use ry_runtime_trap_exit() (from include/ry/runtime/core/alloc.hpp) instead."
            exit 1
          fi
      - name: Run Cppcheck
        run: |
          # `--suppress=normalCheckLevelMaxBranches` is required from
          # cppcheck 2.16+: that release flips the previously-silent
          # "function exceeds the analysis branch budget" notice from
          # an `information` to a hard exit when paired with
          # `--error-exitcode=1`. The notice is purely advisory and
          # does not flag a defect, so suppressing it at the workflow
          # level keeps the no-apt CI image (which ships cppcheck
          # 2.16) green without having to add a per-file suppression.
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++17 \
            --error-exitcode=1 \
            --suppressions-list=.cppcheck-suppressions \
            --suppress=normalCheckLevelMaxBranches \
            --inline-suppr \
            -i build -i build-asan -i build-tsan \
            -j "$(nproc)" \
            --quiet \
            src/ include/

      - name: Verify ry_llvm_emit ABI struct layout (Rust side, #1995)
        run: |
          # The Rust half of the C++ <-> Rust ABI struct-layout contract:
          # the `const _: () = assert!(size_of / align_of / offset_of! ...)`
          # items in crates/ry_llvm_emit/src/lib.rs are const-evaluated
          # during `cargo check`, so this step fails on any layout drift.
          # (The C++ half is the static_assert TU compiled into ry_tests by
          # the `test` job.) cargo / CARGO_HOME / LLVM_SYS_211_PREFIX are
          # baked into the CI image (docker/ci.Dockerfile). This is a narrow
          # type-check + layout-assert pass; it does NOT build `ry` against
          # the Rust cdylib — the full integration build is the `test` job.
          cargo check -p ry_llvm_emit

  test:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-test-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-test-${{ github.ref }}-
            ci-test-
      - name: Build
        # ry_llvm_emit is the Rust cdylib (the only implementation). The
        # container's /usr/local/llvm is built with LLVM_BUILD_LLVM_DYLIB=ON,
        # so the shared-libLLVM requirement (#1997) is met without an LLVM_DIR
        # override (see docker/ci.Dockerfile).
        run: |
          cmake --preset default
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
      - name: Test (Ry self-tests)
        run: ./build/ry test -p

  # Heavy analysis jobs (clang-tidy, scan-build, asan, tsan, filecheck):
  # All run on every pull_request and on push triggers configured at the
  # workflow level. There is no PR-only skip — the trunk-based development
  # model assumes heavy coverage gates each PR (#1367).
  #
  # Warn-only steps remain warn-only:
  # - scan-build / "Build + Analyze": existing findings still need triage.
  # - tsan / "Test (Ry self-tests / TSan)": upstream LargeMmapAllocator CHECK
  #   on Linux runners (google/sanitizers#1716). The C++ test step above is
  #   the required gate for #630's race fixes.
  # - filecheck / "Run FileCheck IR golden tests": LLVM-version sensitivity
  #   until goldens are confirmed stable.
  #
  # The commented-out fuzz block at the bottom of this file keeps its
  # internal `if:` gate intentionally; do not "tidy" it during edits — when
  # the block is re-enabled the gate may need a deliberate decision.

  clang-tidy:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-clang-tidy-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-clang-tidy-${{ github.ref }}-
            ci-clang-tidy-
      - name: Build
        # PR runs build only the `ry` target (~76 TU) for faster feedback;
        # push-to-main keeps full all-target coverage so clang-tidy has the
        # same compile_commands.json input as on developer machines. See
        # .claude/rules/ci-workflows.md "Static-analysis PR scope: --target ry on PR ...".
        # NOTE: --target ry narrows only the *build* step here; clang-tidy
        # itself still analyses every file matched by `find src -name '*.cpp'`.
        run: |
          cmake --preset default
          cmake --build build ${{ github.event_name == 'pull_request' && '--target ry' || '' }} --parallel
      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' -print0 \
            | xargs -0 -n 1 -P "$(nproc)" clang-tidy -p build --quiet

  scan-build:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          scan-build \
            --use-analyzer=/usr/local/llvm/bin/clang \
            --use-cc=/usr/local/llvm/bin/clang \
            --use-c++=/usr/local/llvm/bin/clang++ \
            cmake --preset default
      - name: Build + Analyze
        # warn-only: triage existing findings before making this required.
        # Once findings are resolved, remove continue-on-error.
        # PR runs analyse only the `ry` target (~76 TU) for faster feedback;
        # push-to-main keeps full all-target coverage. See
        # .claude/rules/ci-workflows.md "Static-analysis PR scope: --target ry on PR ...".
        continue-on-error: true
        run: |
          scan-build \
            --use-analyzer=/usr/local/llvm/bin/clang \
            --use-cc=/usr/local/llvm/bin/clang \
            --use-c++=/usr/local/llvm/bin/clang++ \
            -o scan-build-report \
            --status-bugs \
            cmake --build build ${{ github.event_name == 'pull_request' && '--target ry' || '' }} --parallel
      - name: Upload scan-build report
        if: always()
        # warn-only: this step is best-effort. actions/upload-artifact@v4
        # occasionally fails after exhausting its 5-retry budget when the
        # GitHub Actions artifact API returns a transient HTML error page
        # instead of JSON (observed on #1750 main-branch run). The Build +
        # Analyze step above is the source-of-truth and is already
        # continue-on-error: true for the same warn-only reason; failing
        # the whole scan-build job on an artifact-upload glitch would be
        # strictly worse than just losing one report's diagnostics.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scan-build-report
          path: scan-build-report
          retention-days: 14
          if-no-files-found: ignore

  filecheck:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-filecheck-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-filecheck-${{ github.ref }}-
            ci-filecheck-
            ci-test-
      - name: Configure
        run: cmake --preset default
      - name: Build ry
        run: cmake --build build --target ry
      - name: Run FileCheck IR golden tests
        # warn-only: triage LLVM-version sensitivity before making this required.
        # Once goldens are confirmed stable across LLVM updates, remove continue-on-error.
        continue-on-error: true
        run: ctest --test-dir build -L filecheck --output-on-failure

  asan:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-asan-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-asan-${{ github.ref }}-
            ci-asan-
      - name: Build (ASan + UBSan)
        # Only the C++ side (ry_lib / ry / ry_tests) is ASan+UBSan-instrumented;
        # the Rust cdylib and shared libLLVM are uninstrumented because corrosion
        # does not propagate -fsanitize=* into the cargo build (#1993). This
        # mirrors LLVM itself, which is also linked uninstrumented.
        run: |
          cmake --preset asan
          cmake --build build-asan
      - name: Test (C++ / ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/ry_tests
      - name: Test (Ry self-tests / ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/ry test -p

  tsan:
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/ry-ci:llvm-21
    # ThreadSanitizer coverage for #630's P0 race fixes is split:
    #
    # - The C++ test step is REQUIRED. It runs ry_tests, which
    #   includes ConcurrencySpecSuite → the @parallel for stress
    #   tests in tests/spec/concurrency.test.ry. This is where the
    #   #630 race fixes are actually validated. Any PR that
    #   re-introduces a race will fail this step.
    #
    # - The Ry self-test step is WARN-ONLY (continue-on-error).
    #   Not because races are tolerated, but because TSan's
    #   LargeMmapAllocator trips an internal CHECK failure on
    #   Linux runners that is unrelated to ry code (upstream
    #   issue https://github.com/google/sanitizers/issues/1716).
    #   The failure is not reproducible on macOS or in the C++
    #   test harness — it is a TSan runtime / allocator bug that
    #   only surfaces under the self-test driver's subprocess
    #   layout. Pinning to ubuntu-22.04 and lowering
    #   vm.mmap_rnd_bits=28 were both tried and neither helped.
    #   The warn-only step still reports races in the log; once
    #   upstream fixes the allocator CHECK we should flip this
    #   back to required.
    steps:
      - uses: actions/checkout@v4
      - name: Lower ASLR entropy for TSan compatibility
        # Ubuntu 24.04 defaults to vm.mmap_rnd_bits=32, which is one
        # of several things that can trip TSan's allocator. Lowering
        # to 28 is the upstream-recommended first line of defence even
        # though it does not fully fix the self-test crash. The sysctl
        # is applied on the host runner (not inside the container)
        # because the container shares the host kernel namespace.
        # See https://github.com/google/sanitizers/issues/1716.
        run: sysctl -w vm.mmap_rnd_bits=28 || sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ci-tsan-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ci-tsan-${{ github.ref }}-
            ci-tsan-
      - name: Build (TSan)
        # TSan instruments only the C++ side; the Rust cdylib and shared libLLVM
        # are uninstrumented (corrosion does not propagate -fsanitize=* into the
        # cargo build — #1993). The cdylib's 28 ABI functions are single-threaded
        # IR-builder calls, so this does not weaken the #630 race gate, which
        # lives in the (instrumented) C++ runtime exercised by ry_tests.
        run: |
          cmake --preset tsan
          cmake --build build-tsan
      - name: Test (C++ / TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./build-tsan/ry_tests
      - name: Test (Ry self-tests / TSan)
        # Warn-only: see the job-level comment. TSan's LargeMmapAllocator
        # is currently broken for the self-test subprocess layout on
        # Linux runners (unrelated to ry code). The C++ test step above
        # is the required gate for #630's race fixes.
        continue-on-error: true
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./build-tsan/ry test -p

  macos-smoke-rust:
    # macOS build/link smoke for the ry_llvm_emit Rust cdylib.
    # workflow_dispatch-only: macOS runners cost ~10x a Linux runner, and the
    # purpose is to prove the Apple-linker path works on demand — specifically
    # that the `-Wl,-undefined,dynamic_lookup` cdylib link arg in
    # crates/ry_llvm_emit/build.rs resolves __ry_* and LLVM* symbols from the
    # host process. The per-PR safety net is the Linux test/asan/tsan jobs
    # above. Homebrew llvm@21 ships a shared libLLVM.dylib, satisfying the
    # shared-libLLVM requirement (#1997). Retained past the #1993 cutover to
    # keep continuous Apple-linker validation before the tag-push-driven
    # release.yml runs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache LLVM 21 (brew)
        id: cache-llvm-brew
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/opt/llvm@21
            /opt/homebrew/Cellar/llvm@21
          key: llvm-21-darwin-arm64
      - name: Install LLVM 21 (brew)
        if: steps.cache-llvm-brew.outputs.cache-hit != 'true'
        run: brew install llvm@21
      - name: Install dependencies (brew)
        run: brew install openssl@3 ninja googletest
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-macos-smoke-rust
          restore-keys: |
            ci-macos-smoke-rust-
      - name: Build (Rust ry_llvm_emit)
        # Homebrew llvm@21 provides the shared libLLVM.dylib that the Rust
        # cdylib requires; cargo/rustc are pre-installed on GitHub macOS
        # runners. LLVM_SYS_211_PREFIX is derived by CMake from LLVM_DIR via
        # corrosion_set_env_vars (see CMakeLists.txt), so llvm-sys finds the
        # same Homebrew LLVM. This is the CI form of the local
        # `cmake --preset rust-emit` build.
        run: |
          cmake -B build -G Ninja \
            -DLLVM_DIR="$(brew --prefix llvm@21)/lib/cmake/llvm" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
      - name: Test (Ry self-tests)
        run: ./build/ry test -p

