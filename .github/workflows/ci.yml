name: CI
on:
  pull_request:
  push:
    branches: [main, 'v[0-9]*']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for banned unsafe allocation functions
        run: |
          # Scan src/ and include/ for raw malloc/realloc/calloc/strdup/strndup.
          # Exclude runtime_alloc.hpp (the wrapper implementation itself) and
          # lines that are already using the checked_* wrappers.
          if grep -rn --include='*.cpp' --include='*.hpp' \
            -E '\b(std::)?(malloc|realloc|calloc|strdup|strndup)\s*\(' \
            src/ include/ \
            | grep -v 'runtime_alloc\.hpp' \
            | grep -v 'checked_'; then
            echo "::error::Raw allocation functions detected. Use checked_* wrappers from include/ry/runtime_alloc.hpp instead."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev clang-21
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-ubuntu-${{ github.ref }}
          restore-keys: |
            ci-ubuntu-
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
      - name: Test (Ry self-tests)
        run: ./build/ry test -p

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev clang-21
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-asan-${{ github.ref }}
          restore-keys: |
            ci-asan-
      - name: Build (ASan)
        run: |
          cmake -B build-asan -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON
          cmake --build build-asan
      - name: Test (C++ / ASan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
        run: ./build-asan/ry_tests
      - name: Test (Ry self-tests / ASan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
        run: ./build-asan/ry test -p
