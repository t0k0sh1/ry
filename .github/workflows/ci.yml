name: CI
on:
  pull_request:
  push:
    branches: [main, 'v[0-9]*']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-ubuntu-${{ github.ref }}
          restore-keys: |
            ci-ubuntu-
      - name: Build
        run: |
          cmake -B build -G Ninja -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
      - name: Test (Ry self-tests)
        run: ./build/ry test -p

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-asan-${{ github.ref }}
          restore-keys: |
            ci-asan-
      - name: Build (ASan)
        run: |
          cmake -B build-asan -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON
          cmake --build build-asan
      - name: Test (C++ / ASan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
        run: ./build-asan/ry_tests
      - name: Test (Ry self-tests / ASan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
        run: ./build-asan/ry test -p

  asan-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-asan-trace-${{ github.ref }}
          restore-keys: |
            ci-asan-trace-
      - name: Build (ASan)
        run: |
          cmake -B build-asan -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON
          cmake --build build-asan
      - name: Trace concurrency tests (ASan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
        run: |
          for f in tests/spec/concurrency.test.ry \
                   tests/spec/thread.test.ry \
                   tests/spec/http.test.ry \
                   tests/spec/http_client.test.ry \
                   tests/spec/http_form.test.ry \
                   tests/spec/http_listen.test.ry \
                   tests/spec/net.test.ry; do
            echo "::group::$f"
            ./build-asan/ry test --trace "$f"
            echo "::endgroup::"
          done
