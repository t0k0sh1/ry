name: CI
on:
  pull_request:
  push:
    branches: [main, 'v[0-9]*']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for banned unsafe allocation functions
        run: |
          # Scan src/ and include/ for raw malloc/realloc/calloc/strdup/strndup.
          # Exclude runtime_alloc.hpp (the wrapper implementation itself) and
          # lines that are already using the checked_* wrappers.
          if grep -rn --include='*.cpp' --include='*.hpp' \
            -E '\b(std::)?(malloc|realloc|calloc|strdup|strndup)\s*\(' \
            src/ include/ \
            | grep -v 'runtime_alloc\.hpp' \
            | grep -v 'checked_'; then
            echo "::error::Raw allocation functions detected. Use checked_* wrappers from include/ry/runtime_alloc.hpp instead."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev clang-21
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-ubuntu-${{ github.ref }}
          restore-keys: |
            ci-ubuntu-
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21
          cmake --build build
      - name: Test (C++)
        run: ./build/ry_tests
      - name: Test (Ry self-tests)
        run: ./build/ry test -p

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev clang-21
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-asan-${{ github.ref }}
          restore-keys: |
            ci-asan-
      - name: Build (ASan + UBSan)
        run: |
          cmake -B build-asan -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=ON
          cmake --build build-asan
      - name: Test (C++ / ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/ry_tests
      - name: Test (Ry self-tests / ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_container_overflow=0:detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/ry test -p

  tsan:
    runs-on: ubuntu-latest
    # ThreadSanitizer test steps are required: #630's P0 race fixes
    # (auto-atomic ARC retain/release on @parallel for capture, retain
    # at worker entry for the CoW `>1` invariant, atomic CoW guard,
    # atomic strong_count read in GC) have landed, so TSan must stay
    # clean on every PR. Any new race must be fixed within the PR that
    # introduces it. If TSan exposes a pre-existing race pattern not in
    # #630's audit, file a new concurrency issue.
    steps:
      - uses: actions/checkout@v4
      - name: Lower ASLR entropy for TSan compatibility
        # Ubuntu 24.04 (ubuntu-latest) defaults to vm.mmap_rnd_bits=32, which
        # is incompatible with the TSan LargeMmapAllocator: it triggers
        # "CHECK failed: sanitizer_allocator_secondary.h:297 ...IsAligned..."
        # during deallocation. Lowering to 28 matches the pre-24.04 default
        # and is the upstream-recommended workaround.
        # See: https://github.com/google/sanitizers/issues/1716
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev clang-21
      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-tsan-${{ github.ref }}
          restore-keys: |
            ci-tsan-
      - name: Build (TSan)
        run: |
          cmake -B build-tsan -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TSAN=ON
          cmake --build build-tsan
      - name: Test (C++ / TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./build-tsan/ry_tests
      - name: Test (Ry self-tests / TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./build-tsan/ry test -p
