name: Dev Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 手動実行: 現在のブランチでビルド
  manual:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Validate branch
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "::error::Dev release can only run on v* branches (current: ${GITHUB_REF_NAME})"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: brew install llvm@21
      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME}-nightly" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          cmake -B build \
            -DLLVM_DIR="$(brew --prefix llvm@21)/lib/cmake/llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DRY_VERSION="${{ steps.version.outputs.version }}"
          cmake --build build
      - name: Test
        run: ./build/ry_tests
      - name: Package
        run: |
          mkdir -p dist
          cp build/ry dist/ry
          cd dist
          tar czf ry-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz ry
          shasum -a 256 ry-*.tar.gz > checksums.txt
      - name: Cleanup old prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          gh release list --json tagName,isPrerelease -q \
            ".[] | select(.isPrerelease and (.tagName | startswith(\"${BRANCH}-\"))) | .tagName" \
            | while read -r tag; do
                echo "Deleting old release: $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done
      - name: Create Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Dev build from branch ${GITHUB_REF_NAME}" \
            --prerelease \
            dist/ry-*.tar.gz dist/checksums.txt
