name: Release
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            llvm_install: brew
          - os: ubuntu-22.04
            target: linux-amd64
            llvm_install: apt
          - os: ubuntu-22.04-arm
            target: linux-arm64
            llvm_install: apt
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # --- LLVM 21: macOS (Homebrew) ---
      - name: Cache LLVM 21 (brew)
        if: matrix.llvm_install == 'brew'
        id: cache-llvm-brew
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/opt/llvm@21
            /opt/homebrew/Cellar/llvm@21
          key: llvm-21-${{ matrix.target }}
      - name: Install LLVM 21 (brew)
        if: matrix.llvm_install == 'brew' && steps.cache-llvm-brew.outputs.cache-hit != 'true'
        run: brew install llvm@21
      - name: Install dependencies (brew)
        if: matrix.llvm_install == 'brew'
        run: brew install openssl@3 ninja googletest

      # --- LLVM 21: Linux (APT) ---
      - name: Install LLVM 21 (apt)
        if: matrix.llvm_install == 'apt'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libllvm21 llvm-21-dev clang-21
      - name: Install dependencies (apt)
        if: matrix.llvm_install == 'apt'
        run: sudo apt-get install -y libssl-dev ninja-build libgtest-dev libgmock-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: release-${{ matrix.target }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Read version
        id: version
        run: echo "version=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build (macOS)
        if: matrix.llvm_install == 'brew'
        run: |
          cmake -B build -G Ninja \
            -DLLVM_DIR="$(brew --prefix llvm@21)/lib/cmake/llvm" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Build (Linux)
        if: matrix.llvm_install == 'apt'
        run: |
          cmake -B build -G Ninja \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ./build/ry_tests

      - name: Package
        run: |
          mkdir -p dist/lib dist/share
          cp build/ry dist/ry
          shopt -s nullglob
          native_libs=(build/lib/libry_*.*)
          if [ ${#native_libs[@]} -eq 0 ]; then
            echo "::warning::No native libraries found matching build/lib/libry_*.* — packaging without native libs"
          else
            cp "${native_libs[@]}" dist/lib/
          fi
          shopt -u nullglob
          cp -r share/std dist/share/std
          cd dist
          tar czf ry-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz ry lib/ share/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ry-${{ matrix.target }}
          path: dist/ry-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists. Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Download all artifacts
        if: env.SKIP != 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        if: env.SKIP != 'true'
        run: |
          cd artifacts
          shasum -a 256 ry-*.tar.gz > checksums.txt

      - name: Sign checksums
        if: env.SKIP != 'true' && env.RY_SIGNING_PRIVATE_KEY != ''
        uses: ./.github/actions/sign-checksums
        with:
          checksums_dir: artifacts
        env:
          RY_SIGNING_PRIVATE_KEY: ${{ secrets.RY_SIGNING_PRIVATE_KEY }}

      - name: Extract changelog
        if: env.SKIP != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "No changelog entries for $VERSION." > release_notes.txt
          fi

      - name: Create Release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="artifacts/ry-*.tar.gz artifacts/checksums.txt"
          if [ -f artifacts/checksums.txt.sig ]; then
            ASSETS="$ASSETS artifacts/checksums.txt.sig"
          fi
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file release_notes.txt \
            --latest \
            $ASSETS
