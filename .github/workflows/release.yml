name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  release:
    runs-on: macos-14
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21 and OpenSSL
        run: |
          brew install llvm@21 openssl@3
      - name: Read version
        id: version
        run: echo "version=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Check if release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists. Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Build
        if: env.SKIP != 'true'
        run: |
          cmake -B build \
            -DLLVM_DIR="$(brew --prefix llvm@21)/lib/cmake/llvm" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        if: env.SKIP != 'true'
        run: ./build/ry_tests
      - name: Package
        if: env.SKIP != 'true'
        run: |
          mkdir -p dist/lib/std
          cp build/ry dist/ry
          cp lib/std/*.ry dist/lib/std/
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "{\"version\":\"$VERSION\",\"files\":[$(cd lib/std && ls *.ry | sed 's/.*/"&"/' | paste -sd, -)]}" > dist/lib/std/manifest.json
          cd dist
          tar czf ry-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz ry lib/
          shasum -a 256 ry-*.tar.gz > checksums.txt
      - name: Create Release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest \
            dist/ry-*.tar.gz dist/checksums.txt
