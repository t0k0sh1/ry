name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_codeql_gate:
        description: 'Skip the CodeQL preflight gate. Use only when CodeQL itself is broken or unavailable.'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            llvm_install: brew
          - os: ubuntu-24.04
            target: linux-amd64
            llvm_install: container
          - os: ubuntu-24.04-arm
            target: linux-arm64
            llvm_install: container
    runs-on: ${{ matrix.os }}
    # Linux jobs run inside ghcr.io/<owner>/ry-ci-glibc-old (gcc:14-bookworm
    # base, glibc 2.36, source-built LLVM 21). macOS continues to use
    # Homebrew on the host runner.
    #
    # The tag is pinned to the immutable per-build form
    # `:llvm-<MAJOR>-rev<N>` rather than the mutable `:llvm-<MAJOR>` pointer
    # so that re-running this workflow on an older `vX.Y.Z` source tag pulls
    # the same image bits as the original release. `build-ci-image.yml`
    # publishes both tags simultaneously (#1508). The mutable `:llvm-<MAJOR>`
    # is fine for `ci.yml` / `codeql.yml` (artifacts never leave the runner)
    # but unsafe here because release artifacts must be byte-reproducible
    # across re-runs. Bump during Release prep — see
    # `.claude/skills/preparing-for-release/SKILL.md` and
    # `.claude/skills/ci-image-workflow/SKILL.md`.
    container: ${{ matrix.llvm_install == 'container' && format('ghcr.io/{0}/ry-ci-glibc-old:llvm-21-rev14', github.repository_owner) || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag is semver
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a stable semver tag (expected ^v[0-9]+\.[0-9]+\.[0-9]+\$). Prerelease tags (e.g. v0.0.14-rc.1) must not trigger the stable release workflow."
            exit 1
          fi

      # --- LLVM 21: macOS (Homebrew) ---
      - name: Cache LLVM 21 (brew)
        if: matrix.llvm_install == 'brew'
        id: cache-llvm-brew
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/opt/llvm@21
            /opt/homebrew/Cellar/llvm@21
          key: llvm-21-${{ matrix.target }}
      - name: Install LLVM 21 (brew)
        if: matrix.llvm_install == 'brew' && steps.cache-llvm-brew.outputs.cache-hit != 'true'
        run: brew install llvm@21
      - name: Install dependencies (brew)
        if: matrix.llvm_install == 'brew'
        run: brew install openssl@3 ninja googletest

      - name: Restore ccache (Linux container)
        if: matrix.llvm_install == 'container'
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: release-${{ matrix.target }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            release-${{ matrix.target }}-${{ github.ref }}-
            release-${{ matrix.target }}-

      - name: Setup ccache (macOS)
        if: matrix.llvm_install == 'brew'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: release-${{ matrix.target }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Read version
        id: version
        run: |
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          echo "version=v${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION_NO_V}" >> "$GITHUB_OUTPUT"

      - name: Build (macOS)
        if: matrix.llvm_install == 'brew'
        run: |
          cmake -B build -G Ninja \
            -DLLVM_DIR="$(brew --prefix llvm@21)/lib/cmake/llvm" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DRY_VERSION="${{ steps.version.outputs.version_no_v }}"
          cmake --build build

      - name: Build (Linux container)
        if: matrix.llvm_install == 'container'
        # CC, CXX, LLVM_DIR, OPENSSL_ROOT_DIR are all set by the
        # container image. RY_VENDORED_GTEST_TARBALL points at the
        # vendored gtest tarball baked into the image.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRY_VERSION="${{ steps.version.outputs.version_no_v }}"
          cmake --build build

      - name: Test
        run: ./build/ry_tests

      - name: Package
        shell: bash
        run: |
          # Assemble a self-contained dist/ tree: bundle shared libLLVM (+ the
          # macOS chain dep libzstd) and the Rust cdylib next to ry, rewriting
          # absolute install names / rpaths so the release binary runs on a system
          # without an installed LLVM (#2005). verify-bundle.sh asserts the rewrite
          # (and that no build-machine-absolute LLVM path survives) before we tar.
          platform=$([[ "${{ matrix.target }}" == darwin-* ]] && echo darwin || echo linux)
          bash scripts/bundle-dist.sh "$platform" build dist
          bash scripts/verify-bundle.sh dist "$platform"
          tarball="ry-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          cd dist
          tar czf "$tarball" ry lib/ share/ LICENSE-LLVM.txt
          size=$(stat -f%z "$tarball" 2>/dev/null || stat -c%s "$tarball")
          echo "::notice::Tarball $tarball size: $((size / 1024 / 1024)) MB ($size bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ry-${{ matrix.target }}
          path: dist/ry-*.tar.gz

  codeql-gate:
    # Preflight gate that confirms the CodeQL Advanced workflow run for
    # this exact `github.sha` finished with `conclusion=success` before
    # the release job is allowed to publish artifacts.
    #
    # Background: codeql.yml is triggered by main pushes (event=push) and
    # is independent of release.yml. Without this gate, a tag push that
    # races a main push can publish a GitHub Release before the
    # corresponding CodeQL analysis has even started — see #1542 (v0.0.18
    # was published 2026-05-03 03:55:21Z while CodeQL run for e3431e86
    # was still in_progress).
    #
    # The gate filters CodeQL runs by `event=push` to ignore PR-triggered
    # and workflow_dispatch-triggered runs, which do not represent the
    # mainline analysis state. Override via workflow_dispatch +
    # `skip_codeql_gate=true` is provided as an escape hatch only.
    #
    # Polling parameters (INITIAL_WAIT_SECONDS / POLL_INTERVAL_SECONDS /
    # POLL_TIMEOUT_SECONDS) are exposed as env vars so the script body can
    # be exercised locally with shortened timeouts during development.
    if: github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.skip_codeql_gate != true)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      INITIAL_WAIT_SECONDS: '120'
      POLL_INTERVAL_SECONDS: '30'
      POLL_TIMEOUT_SECONDS: '1800'
    steps:
      - name: Wait for CodeQL run on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          query_run() {
            gh api \
              "repos/${OWNER}/${REPO}/actions/workflows/codeql.yml/runs?head_sha=${SHA}&event=push&per_page=10" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0]'
          }

          # Phase 1: wait for a CodeQL run to appear for this SHA. main push
          # and tag push do not have a guaranteed arrival order, so this
          # wait absorbs the race where release.yml starts before CodeQL
          # has been enqueued for the same commit.
          echo "Phase 1: waiting up to ${INITIAL_WAIT_SECONDS}s for a CodeQL run on SHA ${SHA}"
          phase1_deadline=$(( SECONDS + INITIAL_WAIT_SECONDS ))
          run_json=""
          while [[ $SECONDS -lt $phase1_deadline ]]; do
            run_json=$(query_run)
            if [[ -n "$run_json" && "$run_json" != "null" ]]; then
              break
            fi
            echo "  no CodeQL run yet, sleeping ${POLL_INTERVAL_SECONDS}s..."
            sleep "$POLL_INTERVAL_SECONDS"
          done

          if [[ -z "$run_json" || "$run_json" == "null" ]]; then
            echo "::error::No CodeQL workflow run (event=push) found for SHA ${SHA} after ${INITIAL_WAIT_SECONDS}s wait."
            echo "::error::Likely causes: tag points to a commit that was never pushed to main, or codeql.yml does not analyze this branch."
            echo "::error::To bypass intentionally, re-run via workflow_dispatch with skip_codeql_gate=true."
            exit 1
          fi

          # Phase 2: poll until the run reaches status=completed, then
          # assert conclusion=success. Anything else (failure / cancelled
          # / timed_out / action_required / etc.) fails the gate.
          echo "Phase 2: polling until CodeQL run completes (timeout ${POLL_TIMEOUT_SECONDS}s)"
          phase2_deadline=$(( SECONDS + POLL_TIMEOUT_SECONDS ))
          while [[ $SECONDS -lt $phase2_deadline ]]; do
            status=$(echo "$run_json" | jq -r '.status')
            conclusion=$(echo "$run_json" | jq -r '.conclusion')
            run_id=$(echo "$run_json" | jq -r '.id')
            run_url=$(echo "$run_json" | jq -r '.html_url')

            echo "  CodeQL run #${run_id} status=${status} conclusion=${conclusion} url=${run_url}"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "::notice::CodeQL gate passed for SHA ${SHA} (run ${run_url})"
                exit 0
              fi
              echo "::error::CodeQL gate failed: status=${status} conclusion=${conclusion} for SHA ${SHA}"
              echo "::error::Run: ${run_url}"
              exit 1
            fi

            sleep "$POLL_INTERVAL_SECONDS"
            run_json=$(query_run)
          done

          echo "::error::CodeQL run did not complete within ${POLL_TIMEOUT_SECONDS}s for SHA ${SHA}"
          if [[ -n "$run_json" && "$run_json" != "null" ]]; then
            run_url=$(echo "$run_json" | jq -r '.html_url')
            echo "::error::Last observed run: ${run_url}"
          fi
          exit 1

  release:
    needs: [build, codeql-gate]
    # always() ensures release is evaluated even when codeql-gate is
    # skipped (workflow_dispatch + skip_codeql_gate=true). build success
    # is required strictly; codeql-gate may be either success or skipped.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.codeql-gate.result == 'success' || needs.codeql-gate.result == 'skipped') &&
      github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          echo "version=v${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION_NO_V}" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists. Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Download all artifacts
        if: env.SKIP != 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        if: env.SKIP != 'true'
        run: |
          cd artifacts
          shasum -a 256 ry-*.tar.gz > checksums.txt

      - name: Sign checksums
        if: env.SKIP != 'true' && env.RY_SIGNING_PRIVATE_KEY != ''
        uses: ./.github/actions/sign-checksums
        with:
          checksums_dir: artifacts
        env:
          RY_SIGNING_PRIVATE_KEY: ${{ secrets.RY_SIGNING_PRIVATE_KEY }}

      - name: Extract changelog
        if: env.SKIP != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version_no_v }}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "No changelog entries for $VERSION." > release_notes.txt
          fi

      - name: Create Release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="artifacts/ry-*.tar.gz artifacts/checksums.txt"
          if [ -f artifacts/checksums.txt.sig ]; then
            ASSETS="$ASSETS artifacts/checksums.txt.sig"
          fi
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file release_notes.txt \
            --latest \
            $ASSETS
