name: Sign checksums
description: Sign checksums.txt using OpenSSL with RY_SIGNING_PRIVATE_KEY

inputs:
  checksums_dir:
    description: Directory containing checksums.txt
    required: true
  openssl_bin:
    description: Path to OpenSSL 3.x binary (must support pkeyutl -rawin)
    required: false
    default: openssl

runs:
  using: composite
  steps:
    - name: Sign checksums
      shell: bash
      run: |
        OPENSSL="${{ inputs.openssl_bin }}"
        KEY_FILE="$(mktemp /tmp/signing_key.XXXXXX.pem)"
        SIG_RAW="$(mktemp /tmp/checksums.sig.XXXXXX.raw)"
        trap 'rm -f "$KEY_FILE" "$SIG_RAW"' EXIT
        echo "$RY_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"
        "$OPENSSL" pkeyutl -sign \
          -inkey "$KEY_FILE" \
          -rawin \
          -in ${{ inputs.checksums_dir }}/checksums.txt \
          -out "$SIG_RAW"
        "$OPENSSL" base64 -A -in "$SIG_RAW" -out ${{ inputs.checksums_dir }}/checksums.txt.sig
