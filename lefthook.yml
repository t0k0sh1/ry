pre-commit:
  commands:
    check-branch:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then
          echo "ERROR: 'main' ブランチへの直接コミットは禁止されています。"
          echo "フィーチャーブランチを作成してから作業してください。"
          echo "  git checkout -b <feature-branch-name>"
          exit 1
        fi
