# Rust implementation of the LLVM IR emission shared library.
#
# Issue #1950: reimplement src/llvm_emit/impl.cpp (1872 lines C++) in
# Rust behind the C ABI defined by include/ry/llvm_emit/api.h. The
# C ABI is locked by #1949 and lints in CMakeLists.txt enforce no
# LLVM-owned types in any public signature.
#
# The cdylib resolves LLVM symbols and `__ry_*` runtime symbols from
# the host process at runtime (-undefined dynamic_lookup on macOS,
# -rdynamic on Linux). It is NOT linked against LLVM at build time;
# llvm-sys is only used for the typed FFI definitions of LLVM C API
# entry points.

[package]
name = "ry_llvm_emit"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# llvm-sys versioning maps the LLVM major version into a 3-digit
# prefix; the LLVM 21 series is published as `211.x.y` on crates.io
# (171.x = LLVM 17, 181.x = LLVM 18, 191.x = LLVM 19, 201.x = LLVM 20,
# 211.x = LLVM 21, 221.x = LLVM 22). The matching env var is
# LLVM_SYS_211_PREFIX (set in docker/ci*.Dockerfile and CMakeLists.txt
# `corrosion_set_env_vars`).
llvm-sys = "211"

# Profile settings live at the workspace root in /Cargo.toml — cargo
# ignores `[profile.*]` blocks in workspace-member manifests.
