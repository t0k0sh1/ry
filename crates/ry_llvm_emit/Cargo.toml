# Rust implementation of the LLVM IR emission shared library.
#
# This crate implements the C ABI defined by include/ry/llvm_emit/api.h
# (locked by #1949; ported from C++ to Rust by #1950 / #1993). Lints in
# CMakeLists.txt enforce no LLVM-owned types in any public signature.
#
# The cdylib links the SHARED libLLVM (llvm-sys `force-dynamic`; see the
# dependency note below) so it shares ONE LLVM instance with the host `ry`
# (also linked against shared libLLVM via CMake). `__ry_*` runtime symbols
# still resolve from the host process at runtime (-undefined dynamic_lookup
# on macOS, -rdynamic on Linux). llvm-sys also provides the typed FFI
# definitions of the LLVM C API entry points used by lib.rs.

[package]
name = "ry_llvm_emit"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# llvm-sys versioning maps the LLVM major version into a 3-digit
# prefix; the LLVM 21 series is published as `211.x.y` on crates.io
# (171.x = LLVM 17, 181.x = LLVM 18, 191.x = LLVM 19, 201.x = LLVM 20,
# 211.x = LLVM 21, 221.x = LLVM 22). The matching env var is
# LLVM_SYS_211_PREFIX (set in docker/ci*.Dockerfile and CMakeLists.txt
# `corrosion_set_env_vars`).
#
# `force-dynamic` makes llvm-sys link the SHARED libLLVM.dylib instead of
# the static component archives. Combined with `ry` also linking shared
# libLLVM (CMakeLists `set(LLVM_LIBS LLVM)`), both sides share ONE LLVM
# instance. Static linking gave the cdylib its
# own LLVM copy whose APFloat `fltSemantics` singletons differ from the
# host's, hanging `ConstantFP::get`'s DenseMap lookup on float constants
# (#1997). Requires a shared libLLVM in the LLVM prefix (Homebrew llvm@21
# ships lib/libLLVM.dylib; a static-only prefix like /usr/local/llvm does not).
llvm-sys = { version = "211", features = ["force-dynamic"] }

# Profile settings live at the workspace root in /Cargo.toml — cargo
# ignores `[profile.*]` blocks in workspace-member manifests.
