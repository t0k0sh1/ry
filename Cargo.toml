# Cargo workspace root for the ry repository.
#
# The ry CLI / compiler itself is still C++ (built via cmake --preset
# default). This workspace exists only to host Rust components that are
# linked into the C++ build as cdylib shared libraries — currently just
# `ry_llvm_emit` (issue #1950, the Rust reimplementation of the LLVM IR
# emission ABI defined by #1949 in include/ry/llvm_emit/api.h).
#
# CMake's `option(RY_LLVM_EMIT_IMPL_RUST ...)` selects the C++ vs Rust
# implementation at configure time; corrosion-rs drives the actual
# cargo build from CMake. See docs/architecture/codegen-layering-plan.md
# for the milestone context.

[workspace]
resolver = "2"
members = ["crates/ry_llvm_emit"]

# Profiles live at the workspace root (cargo ignores package-level
# profiles in workspace members). See:
# https://doc.rust-lang.org/cargo/reference/profiles.html#custom-profiles
[profile.release]
debug = false

[profile.dev]
# Local dev / sanitizer builds: optimise away enough to keep IR shape
# comparable to the C++ release build during FileCheck diffs (#1950).
opt-level = 1
