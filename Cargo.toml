# Cargo workspace root for the ry repository.
#
# The ry CLI / compiler itself is C++ (built via cmake --preset default).
# This workspace exists only to host Rust components that are linked into
# the C++ build as cdylib shared libraries — currently just `emit`,
# the Rust implementation of the LLVM IR emission ABI defined by #1949 in
# include/ry/llvm_emit/api.h (ported from C++ to Rust by #1950 / #1993).
#
# corrosion-rs drives the cargo build from CMake. See
# docs/architecture/codegen-layering-plan.md for the milestone context.

[workspace]
resolver = "2"
members = ["crates/emit", "crates/lower", "crates/native_base64", "crates/xid"]

# Profiles live at the workspace root (cargo ignores package-level
# profiles in workspace members). See:
# https://doc.rust-lang.org/cargo/reference/profiles.html#custom-profiles
[profile.release]
debug = false

[profile.dev]
# Local dev / sanitizer builds: optimise away enough to keep IR shape
# comparable to the C++ release build during FileCheck diffs (#1950).
opt-level = 1

# Lint policy for the workspace's Rust crates (currently just emit).
# clippy's default-on lints are warnings here; the CI `lint` job escalates them
# to hard errors via `cargo clippy -- -D warnings` (.github/workflows/ci.yml),
# mirroring how the C++ side is gated by clang-tidy / cppcheck. `priority = -1`
# lets a crate or item layer a narrower allow/deny on top (e.g. the
# `#[allow(clippy::too_many_arguments)]` on emit_cow_retain_loop in lib.rs).
# Crate-specific FFI carve-outs stay as crate-level `#![allow(...)]` in lib.rs.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
